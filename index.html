<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
}

body {
  color: #fff;
  overflow-x: hidden;
  background:
    linear-gradient(
      135deg,
      rgba(255, 94, 98, 0.9),
      rgba(255, 153, 102, 0.9),
      rgba(188, 78, 156, 0.9)
    ),
    url("background.png") center / cover no-repeat fixed;
}

/* START OVERLAY */
#startOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  text-align: center;
  cursor: pointer;
}

.start-box {
  padding: 30px;
  animation: fadeUp 1s ease;
}

.start-box h2 {
  font-size: 28px;
  margin-bottom: 10px;
}

.start-box p {
  font-size: 15px;
  opacity: 0.9;
}

/* DECOR */
.decor {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.balloon {
  position: absolute;
  bottom: -160px;
  width: 120px;
  animation: floatUp 14s linear infinite;
}

.balloon.b1 { left: 10%; }
.balloon.b2 { left: 50%; animation-delay: 5s; }
.balloon.b3 { left: 80%; animation-delay: 9s; }

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  position: relative;
  z-index: 2;
}

.hero img {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 22px;
  border: 4px solid rgba(255,255,255,0.85);
}

.hero h1 {
  font-size: 40px;
  margin-bottom: 12px;
}

.hero p {
  font-size: 16px;
}

/* GALLERY */
.gallery {
  padding: 70px 20px;
  max-width: 1100px;
  margin: auto;
  z-index: 2;
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
}

.grid img,
.grid video {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 18px;
}

/* MESSAGE / GIFT */
.message {
  padding: 80px 24px 110px;
  text-align: center;
  position: relative;
  z-index: 2;
}

/* MUSIC BUTTON */
#musicBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: linear-gradient(135deg, #ff7a18, #ff3d81);
  color: #fff;
  border: none;
  padding: 12px 20px;
  border-radius: 30px;
  cursor: pointer;
  z-index: 999;
}

/* ANIMATIONS */
@keyframes floatUp {
  from { transform: translateY(0); }
  to { transform: translateY(-130vh); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- START OVERLAY -->
<div id="startOverlay">
  <div class="start-box">
    <h2>🎂 A little surprise inside</h2>
    <p>Tap anywhere to begin</p>
  </div>
</div>

<!-- DECOR -->
<div class="decor">
  <img src="balloon.png" class="balloon b1">
  <img src="balloon.png" class="balloon b2">
  <img src="balloon.png" class="balloon b3">
</div>

<!-- HERO -->
<section class="hero">
  <div>
    <img src="heropic.png" alt="Birthday Person">
    <h1>Happy Birthday</h1>
    <p>Today is about celebrating you and all the light you bring ✨</p>
  </div>
</section>

<!-- GALLERY -->
<section class="gallery">
  <div class="grid">
    <video src="pic1.mp4" autoplay muted loop playsinline></video>
    <video src="pic2.mp4" autoplay muted loop playsinline></video>
    <video src="pic3.mp4" autoplay muted loop playsinline></video>
    <img src="pic4.jpeg">
    <img src="pic5.jpeg">
  </div>
</section>

<!-- MESSAGE -->
<section class="message">
  <p>
    Wishing you happiness, confidence and a year full of beautiful moments.
  </p>
</section>

<!-- GIFT SECTION -->
<section class="message">
  <h2 style="font-size:28px; margin-bottom:14px;">🎁 One more thing</h2>
  <p style="margin-bottom:22px;">
    I got you something special.  
    Open it whenever you’re ready 💛
  </p>
  <a href="https://www.amazon.in/g/EF4SCPAJ67A7I7QQ"
     target="_blank"
     style="
       display:inline-block;
       padding:14px 28px;
       background:linear-gradient(135deg,#ff7a18,#ff3d81);
       color:#fff;
       text-decoration:none;
       border-radius:30px;
       font-weight:600;
     ">
     🎁 Open your gift
  </a>
</section>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="birthdaysong.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">🎵 Play music</button>

<script>
const music = document.getElementById("bgMusic");
const overlay = document.getElementById("startOverlay");
const btn = document.getElementById("musicBtn");

overlay.addEventListener("click", () => {
  music.volume = 0.6;
  music.play();
  overlay.style.display = "none";
  btn.textContent = "🎶 Playing";
});

btn.addEventListener("click", () => {
  if (music.paused) {
    music.play();
    btn.textContent = "🎶 Playing";
  } else {
    music.pause();
    btn.textContent = "🎵 Play music";
  }
});
</script>

</body>
</html>
